<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161b18"><meta name="description" content="Your 12-week Fortis strength and muscle training log.">
  <title>Fortis · Training log</title><link rel="stylesheet" href="./fortis.css">
</head>
<body>
  <header class="masthead"><a href="./fortis.html" class="brand">F<span class="brand-dot"></span> <span>FORTIS <small>TRAINING LOG</small></span></a><button id="account-button" class="quiet">Account & sync</button></header>
  <main id="app">
    <section class="intro"><p class="eyebrow">12 WEEKS / STRENGTH + MUSCLE</p><div class="title-line"><h1>Put in the work.</h1><span class="pill">CARLAW</span></div><p class="intro-copy">Four core sessions. One optional day. Your pace.</p></section>
    <nav class="toolbar" aria-label="Workout navigation"><label class="week-label">WEEK <select id="week" aria-label="Training week"></select></label><div id="days" class="days" role="group" aria-label="Session"></div><button id="history-button" class="quiet">History</button></nav>
    <section id="workout" aria-live="off"><p>Loading your program…</p></section>
    <footer class="page-footer"><span id="save-status" role="status">Saved on this device</span><button id="guide-button" class="link-button">Program guide</button></footer>
  </main>
  <aside class="workout-bar" aria-label="Workout controls"><div><strong id="set-count">0 sets</strong><small id="bar-status">Ready when you are</small></div><button id="rest-button" class="quiet">Rest timer</button><button id="finish-button" class="primary">Finish session</button></aside>
  <dialog id="panel"><div class="dialog-top"><h2 id="panel-title"></h2><button id="close-panel" class="quiet" aria-label="Close panel">Close</button></div><div id="panel-body"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript>This training log needs JavaScript. Your original printable plan remains available in ChatGPT.</noscript>
  <script type="module" src="./fortis-app.js"></script>
</body>
</html>
